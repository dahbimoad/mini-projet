<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Ajouter Cours</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Gestion Scolaire</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/eleves">Élèves</a></li>
                    <li class="nav-item"><a class="nav-link" href="/filieres">Filières</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/cours">Cours</a></li>
                    <li class="nav-item"><a class="nav-link" href="/dossiers">Dossiers</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">Ajouter un Cours</h2>
        <div class="card shadow-sm">
            <div class="card-body">
                <form th:action="@{/cours/add}" th:object="${cours}" method="post">
                    <div class="mb-3">
                        <label for="code" class="form-label">Code</label>
                        <input type="text" class="form-control" id="code" th:field="*{code}" required>
                    </div>
                    <div class="mb-3">
                        <label for="intitule" class="form-label">Intitulé</label>
                        <input type="text" class="form-control" id="intitule" th:field="*{intitule}" required>
                    </div>
                    <div class="mb-3">
                        <label for="filiere" class="form-label">Filière</label>
                        <select class="form-select" id="filiere" th:field="*{filiere}">
                            <option value="">Sélectionner une filière</option>
                            <option th:each="filiere : ${filieres}" th:value="${filiere.id}" th:text="${filiere.nom}"></option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success">Enregistrer</button>
                    <a href="/cours" class="btn btn-secondary">Annuler</a>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
