<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Liste des Élèves</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Gestion Scolaire</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="/eleves">Élèves</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/filieres">Filières</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/cours">Cours</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dossiers">Dossiers</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Liste des Élèves</h2>
            <a href="/eleves/add" class="btn btn-primary">Ajouter un Élève</a>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nom</th>
                            <th>Prénom</th>
                            <th>Filière</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="eleve : ${eleves}">
                            <td th:text="${eleve.id}"></td>
                            <td th:text="${eleve.nom}"></td>
                            <td th:text="${eleve.prenom}"></td>
                            <td th:text="${eleve.filiere != null} ? ${eleve.filiere.nom} : 'Aucune'"></td>
                            <td>
                                <a th:href="@{/eleves/details/{id}(id=${eleve.id})}" class="btn btn-info btn-sm">Détails</a>
                                <a th:href="@{/eleves/edit/{id}(id=${eleve.id})}" class="btn btn-warning btn-sm">Modifier</a>
                                <a th:href="@{/eleves/delete/{id}(id=${eleve.id})}" class="btn btn-danger btn-sm"
                                    onclick="return confirm('Êtes-vous sûr ?')">Supprimer</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
