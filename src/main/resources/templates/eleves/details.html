<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Détails Élève</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Gestion Scolaire</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="/eleves">Élèves</a></li>
                    <li class="nav-item"><a class="nav-link" href="/filieres">Filières</a></li>
                    <li class="nav-item"><a class="nav-link" href="/cours">Cours</a></li>
                    <li class="nav-item"><a class="nav-link" href="/dossiers">Dossiers</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">Détails de l'Élève</h2>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${eleve.nom} + ' ' + ${eleve.prenom}">Nom Prénom</h5>
                        <p class="card-text"><strong>ID :</strong> <span th:text="${eleve.id}"></span></p>
                        <p class="card-text"><strong>Filière :</strong> <span th:text="${eleve.filiere != null} ? ${eleve.filiere.nom} : 'Aucune'"></span></p>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">Dossier Administratif</h5>
                        <p class="card-text"><strong>Numéro d'inscription :</strong> <span th:text="${eleve.dossierAdministratif != null} ? ${eleve.dossierAdministratif.numeroInscription} : 'Non défini'"></span></p>
                        <p class="card-text"><strong>Date de création :</strong> <span th:text="${eleve.dossierAdministratif != null} ? ${eleve.dossierAdministratif.dateCreation} : 'Non définie'"></span></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">Cours suivis</h5>
                <ul th:if="${eleve.cours != null and !eleve.cours.isEmpty()}">
                    <li th:each="cours : ${eleve.cours}" th:text="${cours.intitule}"></li>
                </ul>
                <p th:if="${eleve.cours == null or eleve.cours.isEmpty()}" class="text-muted">Aucun cours</p>
            </div>
        </div>

        <a href="/eleves" class="btn btn-secondary">Retour</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
