<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Erreur</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Gestion Scolaire</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/eleves">Élèves</a></li>
                    <li class="nav-item"><a class="nav-link" href="/filieres">Filières</a></li>
                    <li class="nav-item"><a class="nav-link" href="/cours">Cours</a></li>
                    <li class="nav-item"><a class="nav-link" href="/dossiers">Dossiers</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-danger">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0">Une erreur s'est produite</h4>
                    </div>
                    <div class="card-body text-center py-5">
                        <h1 class="display-1 text-danger" th:text="${status}">500</h1>
                        <h3 th:text="${error}">Erreur interne du serveur</h3>
                        <p class="text-muted" th:text="${message}">Une erreur inattendue s'est produite.</p>
                        <hr>
                        <a href="/" class="btn btn-primary">
                            Retour à l'accueil
                        </a>
                        <button onclick="history.back()" class="btn btn-secondary">
                            Retour en arrière
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
