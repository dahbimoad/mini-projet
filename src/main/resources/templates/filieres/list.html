<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Liste des Filières</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Gestion Scolaire</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/eleves">Élèves</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/filieres">Filières</a></li>
                    <li class="nav-item"><a class="nav-link" href="/cours">Cours</a></li>
                    <li class="nav-item"><a class="nav-link" href="/dossiers">Dossiers</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Liste des Filières</h2>
            <a href="/filieres/add" class="btn btn-primary">Ajouter une Filière</a>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Code</th>
                            <th>Nom</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="filiere : ${filieres}">
                            <td th:text="${filiere.id}"></td>
                            <td th:text="${filiere.code}"></td>
                            <td th:text="${filiere.nom}"></td>
                            <td>
                                <a th:href="@{/filieres/details/{id}(id=${filiere.id})}" class="btn btn-info btn-sm">Détails</a>
                                <a th:href="@{/filieres/edit/{id}(id=${filiere.id})}" class="btn btn-warning btn-sm">Modifier</a>
                                <a th:href="@{/filieres/delete/{id}(id=${filiere.id})}" class="btn btn-danger btn-sm"
                                    onclick="return confirm('Êtes-vous sûr ?')">Supprimer</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
